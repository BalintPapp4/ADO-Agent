[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ado-agent"
version = "1.0.0"
description = "Magyar és EU-s adózási törvényjavaslat-figyelő asztali és CLI alkalmazás (Windows & macOS)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "feedparser>=6.0.11",
    "flask>=3.0.0",
    "waitress>=3.0.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.6.0",
]

[project.scripts]
ado-agent = "ado_agent.app:main"

[tool.setuptools.packages.find]
include = ["ado_agent*"]

[tool.setuptools.package-data]
ado_agent = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
