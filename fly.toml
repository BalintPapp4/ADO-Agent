app = "ado-agent-csoport"
primary_region = "fra"
swap_size_mb = 512

[build]

[env]
  ADO_AUTH_ENABLED = "1"
  ADO_COOKIE_SECURE = "1"
  ADO_WEB_MODE = "1"
  ADO_DEFAULT_AUTO_SCAN_MINUTES = "360"

[mounts]
  source = "ado_agent_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
