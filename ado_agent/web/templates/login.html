<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bejelentkezés — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <div class="logo-badge">ADÓ</div>
      <div>
        <h1>{{ app_name }} <span class="ver">v{{ version }}</span></h1>
        <p class="muted small">Csoportos adójogi figyelő — bejelentkezés</p>
      </div>
    </div>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    {% if not has_users %}
      <div class="login-error">
        Még nincs felvett felhasználó. Állítsd be az <code>ADO_USERS</code> titkot (pl. <code>balint:jelszo:admin</code>).
      </div>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <label>
        <span>Felhasználónév</span>
        <input type="text" name="username" required autofocus autocomplete="username">
      </label>
      <label>
        <span>Jelszó</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary login-submit">Belépés</button>
    </form>
  </main>
</body>
</html>
